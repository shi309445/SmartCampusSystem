name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 + 自检
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_campus_system
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/smart_campus_system?charset=utf8mb4
      JWT_SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
      DEEPSEEK_API_KEY: ci-placeholder-not-a-real-key
      DEEPSEEK_MODEL: deepseek-chat
      MEMORY_DISABLED: "1"
      HARNESS_INTENT_ENABLED: "0"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest
      - name: 安全 / 失败处理 / 降级自检
        run: |
          python -m app.utils.guard
          python -m app.harness.resilience
          python -m app.harness.agent --self-check

  smoke:
    name: 接口冒烟（--skip-chat）
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_campus_system
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/smart_campus_system?charset=utf8mb4
      JWT_SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
      DEEPSEEK_API_KEY: ci-placeholder-not-a-real-key
      DEEPSEEK_MODEL: deepseek-chat
      MEMORY_EMBED: "0"
      HARNESS_INTENT_ENABLED: "0"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: 启动 Milvus（standalone + 内嵌 etcd + 本地存储）
        run: |
          docker run -d --name scs-milvus \
            -p 19530:19530 -p 9091:9091 \
            -e ETCD_USE_EMBED=true \
            -e ETCD_DATA_DIR=/var/lib/milvus/etcd \
            -e ETCD_CONFIG_PATH=/milvus/configs/embedEtcd.yaml \
            -e COMMON_STORAGETYPE=local \
            -e DEPLOY_MODE=STANDALONE \
            milvusdb/milvus:v2.4.15
      - name: 等待 Milvus
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9091/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs scs-milvus
          exit 1
      - name: 启动 API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
      - name: 等待 /health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API 未就绪，uvicorn 日志："
          cat /tmp/uvicorn.log
          exit 1
      - name: 灌测试数据
        run: python scripts/seed_test_data.py
      - name: 跑冒烟（不调用大模型）
        run: python scripts/smoke_test_api.py --skip-chat
      - name: 失败时打印服务日志
        if: failure()
        run: cat /tmp/uvicorn.log
